<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>License Activation</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { font-family: sans-serif; padding:24px; background:#f7f7f7; }
    .box { background:#fff; padding:18px; border-radius:6px; max-width:520px; margin:32px auto; box-shadow:0 6px 18px rgba(0,0,0,.06); }
    input, button { padding:8px; font-size:14px; }
    .msg { margin-top:12px; min-height:20px; }
    .ok { color:#080; } 
    .err { color:#b00; }
  </style>
</head>
<body>
  <div class="box" role="main">
    <h2>License Activation</h2>
    <p>Enter your license key to activate your access.</p>

    <form id="licenseForm">
      <div>
        <label for="key">License key</label><br/>
        <input id="key" type="text" placeholder="Enter or paste license key" style="width:100%" />
      </div>

      <div style="margin-top:12px;">
        <button id="save" type="button">Activate & Save</button>
        <a href="/index.html" style="margin-left:8px;">Back</a>
      </div>

      <div id="message" class="msg" aria-live="polite"></div>
    </form>
  </div>

  <script>
    const input = document.getElementById('key');
    const saveBtn = document.getElementById('save');
    const msg = document.getElementById('message');
    const form = document.getElementById('licenseForm');

    // --- Prefill from cookie (if accessible, optional)
    const existing = document.cookie.match(/(^|;)\\s*licenseKey\\s*=\\s*([^;]+)/);
    if (existing) input.value = decodeURIComponent(existing.pop());

    // --- Get redirect query
    function getRedirectParam() {
      try {
        const params = new URLSearchParams(window.location.search);
        return params.get('redirect') ? decodeURIComponent(params.get('redirect')) : '/index.html';
      } catch (e) { return '/index.html'; }
    }
    const redirectTarget = getRedirectParam();

    // --- Call backend to activate license ---
    async function activateLicense(key) {
      try {
        const res = await fetch('/license/activate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key }),
          credentials: 'same-origin'
        });
        return res.json();
      } catch (e) {
        return { ok: false, error: e.message || 'Network error' };
      }
    }

    // --- Save button click ---
    saveBtn.addEventListener('click', async () => {
      const key = input.value.trim();
      if (!key) { msg.textContent = 'Please enter a license key.'; msg.className = 'msg err'; return; }

      msg.textContent = 'Activating license...';
      msg.className = 'msg';

      const result = await activateLicense(key);
      if (result.ok) {
        msg.textContent = 'License activated! Redirecting...';
        msg.className = 'msg ok';
        setTimeout(() => {
          location.href = redirectTarget;
        }, 500);
      } else {
        msg.textContent = 'Activation failed: ' + (result.error || 'unknown error');
        msg.className = 'msg err';
      }
    });

    // --- Enter key submits form ---
    form.addEventListener('submit', e => {
      e.preventDefault();
      saveBtn.click();
    });
  </script>
</body>
</html>
