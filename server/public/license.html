<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>License Status</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { font-family: sans-serif; padding:24px; background:#f7f7f7; }
    .box { background:#fff; padding:18px; border-radius:6px; max-width:520px; margin:32px auto; box-shadow:0 6px 18px rgba(0,0,0,.06); }
    input, button { padding:8px; font-size:14px; }
    .msg { margin-top:12px; min-height:20px; }
    .ok { color: #080; }
    .err { color: #b00; }
  </style>
</head>
<body>
  <div class="box" role="main">
    <h2>License Status</h2>
    <p>Check or save your license key below.</p>

    <form id="licenseForm">
      <div>
        <label for="key">License key</label><br/>
        <input id="key" type="text" placeholder="Enter or paste license key" style="width:100%" />
      </div>

      <div style="margin-top:12px;">
        <button id="check" type="button">Check License</button>
        <button id="save" type="button">Save to cookie</button>
        <a href="/index.html" style="margin-left:8px;">Back</a>
      </div>

      <div id="message" class="msg" aria-live="polite"></div>
    </form>
  </div>

  <script>
    function readCookie(name) {
      const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
      return v ? decodeURIComponent(v.pop()) : '';
    }
    function setCookie(name, val) {
      document.cookie = name + '=' + encodeURIComponent(val) + '; path=/; max-age=' + (60*60*24*365);
    }
    function clearCookie(name) { document.cookie = name + '=; path=/; max-age=0'; }
    function setLicenseCookie(key) { setCookie('licenseKey', key); }
    function clearLicenseCookie() { clearCookie('licenseKey'); }

    const input = document.getElementById('key');
    const msg = document.getElementById('message');
    const checkBtn = document.getElementById('check');
    const saveBtn = document.getElementById('save');
    const form = document.getElementById('licenseForm');

    const existing = readCookie('licenseKey');
    if (existing) input.value = existing;

    function getRedirectParam() {
      try { 
        const params = new URLSearchParams(window.location.search); 
        const r = params.get('redirect'); 
        return r ? decodeURIComponent(r) : null; 
      } catch { return null; } 
    }
    const redirectTarget = getRedirectParam();

    async function activateKey(key) {
      try {
        const res = await fetch('/license/activate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key }),
          credentials: 'same-origin'
        });
        const body = await res.json().catch(() => null);
        return { ok: res.ok, body, status: res.status };
      } catch (e) { return { ok:false, error:e }; }
    }

    async function verifyKey(key) {
      try {
        const res = await fetch('/license/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key }),
          credentials: 'same-origin'
        });
        const body = await res.json().catch(() => null);
        return { ok: res.ok, body, status: res.status };
      } catch (e) { return { ok:false, error:e }; }
    }

    // Check license button
    checkBtn.addEventListener('click', async () => {
      const key = input.value.trim();
      if (!key) { msg.textContent = 'Enter a key first.'; msg.className = 'msg err'; return; }
      msg.textContent = 'Checking...'; msg.className = 'msg';
      const r = await verifyKey(key);
      if (r.ok) { 
        msg.textContent = 'Valid license. Details: ' + JSON.stringify(r.body.license); 
        msg.className = 'msg ok';
      } else {
        msg.textContent = r.status ? 'Server response: ' + (r.body?.error || 'invalid') : 'Could not verify.';
        msg.className = 'msg err';
      }
    });

    // Save (activate) button
    saveBtn.addEventListener('click', async () => {
      const key = input.value.trim();
      if (!key) { msg.textContent = 'Enter a key first.'; msg.className = 'msg err'; return; }
      msg.textContent = 'Activating...'; msg.className = 'msg';
      const r = await activateKey(key);
      if (r.ok) {
        setLicenseCookie(key);
        msg.textContent = 'License activated and saved. Redirecting...'; 
        msg.className = 'msg ok';
        setTimeout(() => {
          if (redirectTarget) location.href = redirectTarget;
          else location.href = '/index.html';
        }, 700);
      } else {
        msg.textContent = r.status ? (r.body?.error || 'activation failed') : 'Could not activate.';
        msg.className = 'msg err';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      saveBtn.click();
    });
  </script>
</body>
</html>
