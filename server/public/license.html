<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>License Status</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { font-family: sans-serif; padding:24px; background:#f7f7f7; }
    .box { background:#fff; padding:18px; border-radius:6px; max-width:520px; margin:32px auto; box-shadow:0 6px 18px rgba(0,0,0,.06); }
    input, button { padding:8px; font-size:14px; }
    .msg { margin-top:12px; min-height:20px; }
    .ok { color: #080; }
    .err { color: #b00; }
  </style>
</head>
<body>
  <div class="box" role="main">
    <h2>License Status</h2>
    <p>This page lets you check or save your license key.</p>

    <form id="licenseForm">
      <div>
        <label for="key">License key</label><br/>
        <input id="key" type="text" placeholder="Enter or paste license key" style="width:100%" />
      </div>

      <div style="margin-top:12px;">
        <button id="check" type="button">Check License</button>
        <button id="save" type="button">Save to cookie</button>
        <a href="/index.html" style="margin-left:8px;">Back</a>
      </div>

      <div id="message" class="msg" aria-live="polite"></div>
    </form>
  </div>

  <script>
    // --- Cookie helpers ---
    function readCookie(name) {
      const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
      return v ? decodeURIComponent(v.pop()) : '';
    }
    function setCookie(name, val) {
      document.cookie = name + '=' + encodeURIComponent(val) + '; path=/; max-age=' + (60*60*24*365);
    }
    function clearCookie(name) {
      document.cookie = name + '=; path=/; max-age=0';
    }
    function setLicenseCookie(key) { setCookie('licenseKey', key); }
    function clearLicenseCookie() { clearCookie('licenseKey'); }

    const input = document.getElementById('key');
    const msg = document.getElementById('message');
    const checkBtn = document.getElementById('check');
    const saveBtn = document.getElementById('save');
    const form = document.getElementById('licenseForm');

    // Prefill input from cookie
    const existing = readCookie('licenseKey');
    if (existing) input.value = existing;

    // Get optional redirect query parameter
    function getRedirectParam() {
      try {
        const params = new URLSearchParams(window.location.search);
        const r = params.get('redirect');
        return r ? decodeURIComponent(r) : null;
      } catch { return null; }
    }
    const redirectTarget = getRedirectParam();

    // Verify license via backend
    async function verifyKey(key) {
      try {
        const res = await fetch('/license/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-license-key': key },
          body: JSON.stringify({ key }),
          credentials: 'same-origin'
        });
        const body = await res.json().catch(() => null);
        return { ok: res.ok, body, status: res.status };
      } catch (e) {
        return { ok:false, error: e };
      }
    }

    // --- Check button ---
    checkBtn.addEventListener('click', async () => {
      const key = input.value.trim();
      if (!key) { msg.textContent = 'Enter a key first.'; msg.className = 'msg err'; return; }
      msg.textContent = 'Checking...'; msg.className = 'msg';
      const r = await verifyKey(key);
      if (r.ok) {
        msg.textContent = 'Valid license. Details: ' + (r.body?.license ? JSON.stringify(r.body.license) : 'verified');
        msg.className = 'msg ok';
      } else {
        msg.textContent = r.status ? 'Server response: ' + (r.body?.error || 'invalid') : 'Could not verify (network or endpoint missing).';
        msg.className = 'msg err';
      }
    });

    // --- Save button ---
    saveBtn.addEventListener('click', () => {
      const key = input.value.trim();
      if (!key) { msg.textContent = 'Enter a key to save.'; msg.className = 'msg err'; return; }
      setLicenseCookie(key);
      msg.textContent = 'Saved. Redirecting...'; msg.className = 'msg ok';
      setTimeout(() => {
        if (redirectTarget) location.href = redirectTarget;
        else location.reload();
      }, 500);
    });

    // --- Form submit (Enter key) ---
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const key = input.value.trim();
      if (!key) { msg.textContent = 'Please enter a license key.'; msg.className = 'msg err'; return; }
      msg.textContent = 'Verifying...'; msg.className = 'msg';
      setLicenseCookie(key);

      const result = await verifyKey(key);
      if (result.ok) {
        msg.textContent = 'License verified and saved. Redirecting...'; msg.className = 'msg ok';
        setTimeout(() => {
          if (redirectTarget) location.href = redirectTarget;
          else location.reload();
        }, 700);
      } else {
        clearLicenseCookie();
        msg.textContent = 'License invalid. Please try again.'; msg.className = 'msg err';
      }
    });
  </script>
</body>
</html>
