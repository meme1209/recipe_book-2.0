<body data-recipe-id="popcorn-salad">

    <nav><a href="../../index.html">← Back to Recipes</a></nav>

    <!-- recipe editor toolbar will be injected here by JS -->
  </header>

  <section>
    <h2>Ingredients</h2>
    <ul class="recipe-ingredients">
      <li>1 cup salad bowl or mayonnaise</li>
      <li>1 cup cheese, shredded</li>
      <li>1 cup celery, diced</li>
      <li>½ lb bacon, fried crisp</li>
      <li>2 cups mandarin oranges</li>
      <li>6 cups popcorn, popped</li>
    </ul>
  </section>

  <section>
    <h2>Instructions</h2>
    <ol class="recipe-instructions">
      <li>Mix everything together just before serving.</li>
    </ol>
  </section>
