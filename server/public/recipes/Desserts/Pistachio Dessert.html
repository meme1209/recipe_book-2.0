  <title>Pistachio Dessert</title>

<body data-recipe-id="pistachio-dessert">
  <header>
    <h1 class="recipe-title">Pistachio Dessert</h1>
    <nav><a href="../../index.html">← Back to Recipes</a></nav>

  <div class="recipe-rating"></div>
    <!-- recipe editor toolbar will be injected here by JS -->
  </header>

  <section>
    <h2>Ingredients</h2>
    <ul class="recipe-ingredients">
      <li>1 pail vanilla ice cream</li>
      <li>4 packages pistachio instant pudding</li>
      <li>4 cups whipped cream.</li>
    </ul>
  </section>

  <section>
    <h2>Instructions</h2>
    <ol class="recipe-instructions">
      <li>Whip cream.</li>
      <li>Add pudding to whipped ice cream.</li>
      <li>Fold in whipped cream.</li>
      <li><strong>Yield:</strong> 4-5 pie plates</li>
    </ol>
  </section>
