  <header>
    <h1 class="recipe-title">Rhubarb Pie</h1>
    <nav><a href="../../index.html">← Back to Recipes</a></nav>
    <!-- recipe editor toolbar will be injected here by JS -->
  </header>

  <section>
    <h2>Ingredients</h2>
    <ul class="recipe-ingredients">
      <li>17 eggs</li>
      <li>4 cups cream</li>
      <li>9 cups milk</li>
      <li>4 cups flour</li>
    </ul>
  </section>

  <section>
    <h2>Instructions</h2>
    <ol class="recipe-instructions">
      <li>Mix well Line plates with crust and put 1 cup sugar and 1 ½ cup Rhubarb in crust. Pour 1 ½ cups of the above mixture in. Bake till nicely thickened.</li>
    </ol>
  </section>
