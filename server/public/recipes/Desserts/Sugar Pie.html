  <title>Sugar Pie</title>

<body data-recipe-id="sugar-pie">
  <header>
    <h1 class="recipe-title">Sugar Pie</h1>
    <nav><a href="../../index.html">← Back to Recipes</a></nav>
    <!-- recipe editor toolbar will be injected here by JS -->
  </header>

  <section>
    <h2>Ingredients</h2>
    <ul class="recipe-ingredients">
      <li>1 TBSP flour</li>
      <li>1 ¼ cup heavy cream</li>
      <li>2 eggs</li>
      <li>1 cup sugar</li>
    </ul>
  </section>

  <section>
    <h2>Instructions</h2>
    <ol class="recipe-instructions">
      <li>Mix all ingredients together and pour into crust. Sprinkle with cinnamon.</li>
      <li>Bake @ 250° for 1 hour.</li>
    </ol>
  </section>
