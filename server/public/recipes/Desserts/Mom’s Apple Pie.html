  <title>Mom’s Apple Pie</title>

<body data-recipe-id="moms-apple-pie">
  <header>
    <h1 class="recipe-title">Mom’s Apple Pie</h1>
    <nav><a href="../../index.html">← Back to Recipes</a></nav>

  <div class="recipe-rating"></div>
    <!-- recipe editor toolbar will be injected here by JS -->
  </header>

  <section>
    <h2>Ingredients</h2>
    <ul class="recipe-ingredients">
      <li>4 cups apples</li>
      <li>¾ cup sugar</li>
      <li>1 tsp cinnamon</li>
      <li>¼ cup flour</li>
    </ul>
  </section>

  <section>
    <h2>Instructions</h2>
    <ol class="recipe-instructions">
      <li>Mix everything together and make pie.</li>
      <li>Bake for 1 hour.</li>
    </ol>
  </section>
