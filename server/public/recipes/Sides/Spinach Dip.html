  <title>Spinach Dip</title>
</head>
<body data-recipe-id="spinach-dip">
  <header>
    <h1 class="recipe-title">Spinach Dip</h1>
    <nav><a href="../../index.html">← Back to Recipes</a></nav>

  <div class="recipe-rating"></div>
    <!-- recipe editor toolbar will be injected here by JS -->
  </header>

  <section>
    <h2>Ingredients</h2>
    <ul class="recipe-ingredients">
      <li>2 cups mayonnaise</li>
      <li>1 cup sour cream</li>
      <li>1 ½ -2 cups spinach</li>
      <li>¼ cup parsley</li>
      <li>1 tsp sugar</li>
      <li>Salt and pepper to taste</li>
    </ul>
  </section>

  <section>
    <h2>Instructions</h2>
    <ol class="recipe-instructions">
      <li>Put everything into blender.</li>
      <li>Blend on medium until smooth.</li>
    </ol>
  </section>
