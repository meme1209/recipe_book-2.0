<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="../../css/style.css" />
  <title>Dill Dip</title>
</head>
<body data-recipe-id="dill-dip">
  <header>
    <h1 class="recipe-title">Dill Dip</h1>
    <nav><a href="../../index.html">← Back to Recipes</a></nav>

  <div class="recipe-rating"></div>
    <!-- recipe editor toolbar will be injected here by JS -->
  </header>

  <section>
    <h2>Ingredients</h2>
    <ul class="recipe-ingredients">
      <li>1-8oz package cream cheese</li>
      <li>1-8oz carton sour cream</li>
      <li>2 TBSP fresh onion greens</li>
      <li>2 TBSP dill</li>
      <li>½ tsp seasoning salt</li>
    </ul>
  </section>

  <section>
    <h2>Instructions</h2>
    <ol class="recipe-instructions">
      <li>Mix all ingredients with electric mixture until fluffy.</li>
    </ol>
  </section>
