  <title>Honey Garlic Ribs</title>
</head>
<body data-recipe-id="honey-garlic-ribs">
  <header>
    <h1 class="recipe-title">Honey Garlic Ribs</h1>
    <nav><a href="../../index.html">← Back to Recipes</a></nav>

  <div class="recipe-rating"></div>
    <!-- recipe editor toolbar will be injected here by JS -->
  </header>

  <section>
    <h2>Ingredients</h2>
    <ul class="recipe-ingredients">
      <li>1 cup ketchup</li>
      <li>1 cup honey</li>
      <li>4 cloves garlic</li>
      <li>½ cup soya sauce</li>
    </ul>
  </section>

  <section>
    <h2>Instructions</h2>
    <ol class="recipe-instructions">
      <li>Mix all ingredients together and bring to a boil.</li>
      <li>Simmer 5 minutes.</li>
      <li>Baste ribs every 15 minutes.</li>
    </ol>
  </section>
