    <nav><a href="../../index.html">← Back to Recipes</a></nav>

  </header>

  <section>
    <h2>Ingredients</h2>
    <ul class="recipe-ingredients">
      <li>1 1/3 cup condensed milk (! Can)</li>
      <li>1 cup whipping cream</li>
      <li>1 TBSP liquid chocolate</li>
      <li>4 eggs</li>
      <li>1 tsp vanilla</li>
    </ul>
  </section>

  <section>
    <h2>Instructions</h2>
    <ol class="recipe-instructions">
      <li>Whip 10 minutes. Add 2 cups rye whiskey. Whip another minute. Chill and serve.</li>
    </ol>
  </section>
