<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - CookBook</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      padding: 20px;
      background: #fafafa;
      font-family: Arial, sans-serif;
    }
    h1 {
      margin-bottom: 10px;
    }
    .box {
      background: #fff;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 25px;
      border: 1px solid #ddd;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 12px;
    }
    input, textarea, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    textarea {
      height: 130px;
    }
    button {
      margin-top: 18px;
      padding: 10px 16px;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #005fa3;
    }
    #message {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Admin Panel</h1>
  <p>Welcome, Admin! Use the tools below to manage your recipes.</p>

  <!-- -------------------- ADD NEW RECIPE -------------------- -->

  <div class="box">
    <h2>Add New Recipe</h2>

    <label>Recipe Title:</label>
    <input type="text" id="title">

    <label>Category:</label>
    <select id="category">
      <option value="Sides">Sides</option>
      <option value="Main Dishes">Main Dishes</option>
      <option value="Desserts">Desserts</option>
      <option value="Breakfast">Breakfast</option>
      <option value="Other">➕ Other (type manually)</option>
    </select>

    <input type="text" id="customCategory" placeholder="Enter custom category"
           style="display:none; margin-top:8px;">

    <label>Ingredients (one per line):</label>
    <textarea id="ingredients"></textarea>

    <label>Instructions:</label>
    <textarea id="instructions"></textarea>

    <button onclick="addRecipe()">Add Recipe</button>

    <div id="message"></div>
  </div>

  <!-- -------------------- LICENSE REMOVE -------------------- -->

  <div class="box">
    <h2>License Settings</h2>
    <button onclick="removeLicense()">Remove License</button>
    <p id="licenseMsg"></p>
  </div>

  <script>
    // Show custom category input when "Other" is selected
    const categorySelect = document.getElementById("category");
    const customCategoryInput = document.getElementById("customCategory");

    categorySelect.addEventListener("change", () => {
      if (categorySelect.value === "Other") {
        customCategoryInput.style.display = "block";
      } else {
        customCategoryInput.style.display = "none";
      }
    });

    // ---------------------- ADD RECIPE ----------------------
    async function addRecipe() {
      const title = document.getElementById("title").value.trim();
      const category = 
        categorySelect.value === "Other" 
        ? customCategoryInput.value.trim()
        : categorySelect.value;

      const ingredientsText = document.getElementById("ingredients").value.trim();
      const instructions = document.getElementById("instructions").value.trim();

      const messageBox = document.getElementById("message");

      if (!title || !category || !ingredientsText || !instructions) {
        messageBox.style.color = "red";
        messageBox.textContent = "All fields are required.";
        return;
      }

      const ingredients = ingredientsText.split("\n").map(i => i.trim()).filter(i => i.length);

      try {
        const res = await fetch("/api/recipes", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ title, category, ingredients, instructions })
        });

        const data = await res.json();

        if (!res.ok) {
          messageBox.style.color = "red";
          messageBox.textContent = data.error || "Failed to add recipe.";
          return;
        }

        messageBox.style.color = "green";
        messageBox.innerHTML = `Recipe added!<br><a href="${data.file}">Open Recipe</a>`;
      } catch (err) {
        messageBox.style.color = "red";
        messageBox.textContent = "Server error.";
      }
    }

    // ---------------------- REMOVE LICENSE ----------------------
    async function removeLicense() {
      const licenseMsg = document.getElementById("licenseMsg");

      const res = await fetch("/license/remove", { method: "POST" });
      const data = await res.json();

      if (data.ok) {
        licenseMsg.style.color = "green";
        licenseMsg.textContent = "License removed. Redirecting...";
        setTimeout(() => (window.location = "/license.html"), 800);
      } else {
        licenseMsg.style.color = "red";
        licenseMsg.textContent = "Failed to remove license.";
      }
    }
  </script>

</body>
</html>
