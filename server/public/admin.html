<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Panel</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { font-family: sans-serif; background: #f7f7f7; padding: 20px; }
    .box { background: white; padding: 20px; border-radius: 8px; max-width: 600px; margin: 20px auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    textarea { width: 100%; height: 120px; }
    input, button, textarea { margin-top: 10px; padding: 8px; font-size: 14px; width: 100%; }
    button { background: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background: #0056b3; }
    .msg { margin-top: 10px; font-weight: bold; }
    .ok { color: green; }
    .err { color: red; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Admin Panel</h1>
    <p>Use this form to add recipes to your site. Each recipe becomes its own HTML file and is automatically added to your main recipe list.</p>

    <form id="recipeForm">
      <input type="text" id="title" placeholder="Recipe Title" required />
      <input type="text" id="category" placeholder="Category (e.g. Dessert, Main Course)" />
      <textarea id="ingredients" placeholder="Ingredients (one per line)" required></textarea>
      <textarea id="instructions" placeholder="Instructions (separate by new lines)" required></textarea>
      <button type="submit">Add Recipe</button>
    </form>

    <div id="message" class="msg"></div>
    <hr>
    <a href="/index.html">⬅ Back to main site</a>
  </div>

  <script>
    const form = document.getElementById('recipeForm');
    const msg = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('title').value.trim();
      const category = document.getElementById('category').value.trim();
      const ingredients = document.getElementById('ingredients').value.trim();
      const instructions = document.getElementById('instructions').value.trim();

      msg.textContent = 'Adding recipe...';
      msg.className = 'msg';

      try {
        const res = await fetch('/api/recipes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, category, ingredients, instructions })
        });

        const body = await res.json().catch(() => ({}));

        if (res.ok) {
          msg.textContent = `✅ Recipe added successfully!`;
          msg.className = 'msg ok';
          form.reset();
        } else {
          msg.textContent = `❌ ${body.error || 'Failed to add recipe'}`;
          msg.className = 'msg err';
        }
      } catch (err) {
        msg.textContent = '❌ Error: ' + err.message;
        msg.className = 'msg err';
      }
    });
  </script>
</body>
</html>
