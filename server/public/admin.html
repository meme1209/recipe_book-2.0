<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Admin Control Panel</h1>

  <section>
    <h2>Add Recipe</h2>
    <form id="addForm">
      <input type="text" id="title" placeholder="Recipe Title" required><br>
      <input type="text" id="type" placeholder="Category (e.g. Dessert)" required><br>
      <textarea id="ingredients" placeholder="Ingredients (one per line)" required></textarea><br>
      <textarea id="instructions" placeholder="Instructions (one per line)" required></textarea><br>
      <button type="submit">Add Recipe</button>
    </form>
  </section>

  <section>
    <h2>Manage Recipes</h2>
    <ul id="recipeList"></ul>
  </section>

  <script src="js/admin.js"></script>
</body>
</html>
