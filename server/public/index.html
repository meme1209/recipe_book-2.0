<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <title>CookBook</title>
  <style>
    /* small helper to ensure the button is visible if your main stylesheet is missing */
    #licenseButton { position:absolute; right:12px; top:12px; padding:6px 10px; background:#007acc; color:#fff; border-radius:4px; text-decoration:none; font-size:13px; }
    header { position:relative; padding-left:0px; padding-right:18px; padding-top:18px; padding-bottom:18px; }
  </style>

</head>
<body>
  <header>
    <h1>CookBook</h1>
    <a id="licenseButton" href="/license.html">License</a>
    <p>Your recipe collection</p>
  </header>

  <main>

    <section>
      <h2>Search Recipes</h2>
      <input type="text" id="SearchInput" placeholder="Type to search..." autocomplete="off" />
      <ul id="searchResults" class="hidden"></ul>
    </section>

    <div id="recipeCategories"></div>

  </main>

  <footer>
    <p>© 2025 CookBook</p>
  </footer>

  <script src="js/recipe-data.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }

    const categoriesContainer = document.getElementById('recipeCategories');

    recipeCategories.forEach(category => {

      const section = document.createElement('section');

      const heading = document.createElement('h2');
      heading.textContent = category.category;

      const ul = document.createElement('ul');

      category.recipes.forEach(recipe => {

        const li = document.createElement('li');

        const link = document.createElement('a');
        link.href = recipe.url;
        link.textContent = recipe.name;

        li.appendChild(link);
        ul.appendChild(li);

      });

      section.appendChild(heading);
      section.appendChild(ul);

      categoriesContainer.appendChild(section);

    });

    const searchInput = document.getElementById('SearchInput');
    const searchResults = document.getElementById('searchResults');

    searchInput.addEventListener('input', () => {

      const query = searchInput.value.toLowerCase();

      searchResults.innerHTML = '';

      if (query === '') {
        searchResults.classList.add('hidden');
        return;
      }

      const matches = recipes.filter(recipe =>
        recipe.name.toLowerCase().includes(query)
      );

      if (matches.length === 0) {

        searchResults.innerHTML = '<li>No results found</li>';

      } else {

        matches.forEach(recipe => {

          const li = document.createElement('li');

          const link = document.createElement('a');

          link.href = recipe.url;
          link.textContent = recipe.name;

          li.appendChild(link);

          searchResults.appendChild(li);

        });

      }

      searchResults.classList.remove('hidden');

    });
  </script>
</body>
</html>
